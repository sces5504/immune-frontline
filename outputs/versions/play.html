<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>免疫前線｜切換版本</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f1f6ef;color:#21443e;font:13px -apple-system,sans-serif}nav{height:54px;display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 10px;border-bottom:2px solid #c1d4c5}select{max-width:360px;font:inherit;background:#ffffff;color:#285549;border:1px solid #8dbca3;padding:7px}a{color:#247963;text-decoration:none;white-space:nowrap}iframe{width:100%;height:calc(100% - 54px);border:0;display:block}a:focus-visible,select:focus-visible{outline:2px solid #f0cb7a;outline-offset:2px}@media(max-width:600px){nav{gap:9px;font-size:11px}select{max-width:155px}label{display:none}}</style></head><body><nav aria-label="遊戲版本切換"><label for="version">切換版本</label><select id="version" aria-label="選擇遊戲版本"></select><a id="latest" href="../index.html">回到新版 ↗</a><a href="index.html">版本檔案室</a></nav><iframe id="game" title="免疫前線遊戲" allow="fullscreen"></iframe><script>
const records=[{"version": "1.0.0", "title": "經典版｜改版前的完整備份", "notes": "保留原本的五個關卡、三種免疫小隊和圓形細胞畫面，可隨時回來遊玩。", "date": "2026-10-10 00:26", "file": "v1.0.0.html", "sha256": "018ee4ab2990949b693ec79a94e42bd10d2b122d5bb4389f19bf4556b72b5110"}, {"version": "2.0.0", "title": "像素戰場｜免疫機制重製", "notes": "像素細胞與動作動畫；呈遞與成熟、漿細胞分泌、Th1／Th17 支援、MAC、胞內結核菌控制、感染上皮死亡；每回合的清除、增殖和組織損傷分開回報。", "date": "2026-10-10 00:47", "file": "v2.0.0.html", "sha256": "3e4303c83ce3468ed17d65b78e25539ebb7f158f2054bb4f5214b9bf081eab5b"}, {"version": "2.1.0", "title": "清晰戰場｜版本自由切換", "notes": "每個版本都有共用切換列；版本檔案室以固定框架開啟舊版。正常組織改為低飽和上皮圖案，病原體用明亮暖色、清晰外框及各自形態，免疫細胞與回合機制維持原設定。", "date": "2026-10-10 01:19", "file": "v2.1.0.html", "sha256": "4a813d9dd6624a9d10fc503c9612a09f190dc50f5da3fb774836cb6284756320"}, {"version": "2.2.0", "title": "淺色生物醫學｜免疫學入門", "notes": "刪除介面中的還原操作提示與頁尾文字；固定免疫學入門按鈕包含戰場概念、細胞分工、抗體與補體、策略反應鏈與名詞字典，可跨主題搜尋。介面、上皮與版本檔案室改為淺色生物醫學配色。", "date": "2026-10-10 09:35", "file": "v2.2.0.html", "sha256": "5c7b237f8f2f49a0eccc6d2ed77f706935bad92d4cbe28f014e90cf4d9df52d4"}];const select=document.querySelector('#version'),frame=document.querySelector('#game');for(const r of records.slice().reverse()){const o=document.createElement('option');o.value=r.version;o.textContent='v'+r.version+' · '+r.title;select.append(o)}const requested=new URLSearchParams(location.search).get('version');select.value=records.some(r=>r.version===requested)?requested:records[records.length-1].version;
function load(){const record=records.find(r=>r.version===select.value);frame.src=record.file+'?embedded=1';document.title='免疫前線 v'+record.version;const url=new URL(location.href);url.searchParams.set('version',record.version);try{history.replaceState(null,'',url)}catch{} }select.onchange=load;document.querySelector('#latest').onclick=(event)=>{event.preventDefault();select.value=records[records.length-1].version;load()};if(location.protocol==='file:')document.querySelector('#latest').href='../immune-frontline.html';load();
</script></body></html>
