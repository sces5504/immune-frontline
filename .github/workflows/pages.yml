name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "還原網站到備份版本，例如 1.0.0；留空部署最新版"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Check gameplay and round invariants
        run: node scripts/check_game.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare site
        env:
          GAME_VERSION: ${{ inputs.version }}
        run: python3 scripts/build_site.py --version "$GAME_VERSION"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
